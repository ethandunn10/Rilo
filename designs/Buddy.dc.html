<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["coach","wave","proud","curious","sleepy","letdown"],"default":"coach"},"size":{"editor":"int","min":40,"max":400,"default":240},"motion":{"editor":"enum","options":["idle","jump","none"],"default":"idle"},"$preview":{"width":240,"height":222}}'>
class Component extends DCLogic {
renderVals() {
const mood = this.props.mood ?? 'coach';
const size = Number(this.props.size ?? 240);
const motion = this.props.motion ?? 'idle';
const ease = '.45 0 .55 1';
const m = motion === 'jump'
? { moveValues: '0 0;0 0;0 -28;0 0;0 0', shadowValues: '60;64;40;64;60', keyTimes: '0;0.2;0.45;0.7;1', splines: '0 0 1 1;.2 .8 .4 1;.6 0 .8 .2;0 0 1 1', dur: '1.3s' }
: motion === 'none'
? { moveValues: '0 0;0 0', shadowValues: '60;60', keyTimes: '0;1', splines: ease, dur: '1s' }
: { moveValues: '0 0;0 -5;0 0', shadowValues: '60;54;60', keyTimes: '0;0.5;1', splines: ease + ';' + ease, dur: '2.4s' };
return {
moveValues: m.moveValues,
shadowValues: m.shadowValues,
keyTimes: m.keyTimes,
splines: m.splines,
dur: m.dur,
size: size,
h: Math.round(size * 185 / 200),
isCoach: mood === 'coach',
isWave: mood === 'wave',
isProud: mood === 'proud',
isCurious: mood === 'curious',
isSleepy: mood === 'sleepy',
isLetdown: mood === 'letdown'
};
}
}
</script>
