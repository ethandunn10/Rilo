<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rilo Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E6F5E8}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tap{transition:transform .15s ease, background .2s ease, border-color .2s ease}.tap:active{transform:scale(.96)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #12301A">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Sky" hills="low" hint-size="390px,844px"></dc-import></div>

<div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 22px 26px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: center; align-items: flex-end; gap: 0; height: 120px; animation: rise .5s ease-out both">
<div style="margin-right: -18px; margin-bottom: 4px"><dc-import name="Skin" look="night" size="100" hint-size="100px,93px"></dc-import></div>
<div style="position: relative; z-index: 1"><dc-import name="Skin" look="shades" size="128" hint-size="128px,118px"></dc-import></div>
<div style="margin-left: -18px; margin-bottom: 4px"><dc-import name="Skin" look="sakura" size="100" hint-size="100px,93px"></dc-import></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; animation: rise .5s .08s ease-out both">
<p style="margin: 0; padding: 4px 12px; border-radius: 999px; background: #12301A; color: #FFFFFF; font-family: Fredoka, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em">rilo pro</p>
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; text-align: center">get the full coach</h1>
</div>
<div style="padding: 14px 16px; border-radius: 24px; background: rgba(255,255,255,0.62); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 10px; animation: rise .5s .16s ease-out both">
<sc-for list="{{perks}}" as="item" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: center">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #12301A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<p style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3"><span style="font-weight: 700">{{item.title}}</span> · {{item.sub}}</p>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; animation: rise .5s .24s ease-out both">
<sc-for list="{{plans}}" as="plan" hint-placeholder-count="2">
<button type="button" class="tap" aria-pressed="{{plan.pressed}}" onClick="{{plan.pick}}" style="{{plan.style}}">
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px">
<span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600">{{plan.name}}</span>
<span style="font-size: 13px; font-weight: 600; color: #3D5A46">{{plan.sub}}</span>
</span>
<span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 700">{{plan.price}}</span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="Home.dc.html" class="tap" style="width: 100%; height: 58px; flex-shrink: 0; border-radius: 999px; background: #FFFFFF; color: #12301A; font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(10,40,20,0.25)">start 3-day free trial</a>
<a href="Home.dc.html" style="font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none; padding: 6px; text-align: center">continue with free</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { plan: 'year' };
}
renderVals() {
const base = 'min-height: 62px; width: 100%; box-sizing: border-box; padding: 0 18px; border-radius: 22px; display: flex; align-items: center; justify-content: space-between; font-family: Inter, system-ui, sans-serif; color: #12301A; cursor: pointer; backdrop-filter: blur(14px); ';
const plans = [
{ id: 'year', name: 'yearly · best value', sub: '$2.50 a month, billed yearly', price: '$29.99/yr' },
{ id: 'month', name: 'monthly', sub: 'billed every month', price: '$4.99/mo' }
];
return {
perks: [
{ title: 'your daily plan', sub: 'built around your goals' },
{ title: 'unlimited apps', sub: 'free covers 3' },
{ title: '6 premium rilos', sub: 'shades, night, sakura + more' },
{ title: 'creator mode', sub: 'turn scroll urges into posting' }
],
plans: plans.map((p) => {
const on = this.state.plan === p.id;
return Object.assign({}, p, {
pressed: on ? 'true' : 'false',
style: on ? base + 'background: #FFFFFF; border: 2.5px solid #12301A; box-shadow: 0 8px 20px rgba(20,60,40,0.14)' : base + 'background: rgba(255,255,255,0.55); border: 2px solid rgba(255,255,255,0.9)',
pick: () => this.setState({ plan: p.id })
});
})
};
}
}
</script>
</body>
</html>
