<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12301A}a:hover{color:#000000}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{width:0}}
.tap{transition:transform .15s ease}.tap:active{transform:scale(.96)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #12301A">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Sky" hills="low" hint-size="390px,844px"></dc-import></div>

<div style="position: relative; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-size: 30px; font-weight: 700; animation: rise .4s ease-out both">progress</h1>
<div style="padding: 14px 16px; border-radius: 26px; background: #12301A; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 30px rgba(10,40,20,0.25); animation: rise .4s .06s ease-out both">
<dc-import name="Buddy" mood="proud" motion="jump" size="84" hint-size="84px,78px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 24px; font-weight: 700">level 4</p>
<div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.18); overflow: hidden"><div style="width: 64%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #9EDCA6, #4CC160); animation: fill 1.2s .3s ease-out both"></div></div>
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #C9E6CE">320 / 500 xp · gold rilo at level 10</p>
</div>
</div>
<div style="padding: 14px 16px; border-radius: 26px; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(20,60,40,0.1); display: flex; flex-direction: column; gap: 10px; animation: rise .4s .12s ease-out both">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600">this week</p>
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 600; color: #1F6B2E">4h 20m saved</p>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; height: 120px; gap: 10px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1">
<div style="{{d.barStyle}}"></div>
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 13px; font-weight: 600; color: #3D5A46">{{d.label}}</p>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; font-weight: 600; color: #3D5A46">green bars hit your 2h goal</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; animation: rise .4s .18s ease-out both">
<div style="padding: 12px 6px; border-radius: 22px; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 700; color: #1F6B2E">6</p>
<p style="margin: 0; font-size: 12px; font-weight: 700">day streak</p>
</div>
<div style="padding: 12px 6px; border-radius: 22px; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 700; color: #1F6B2E">12</p>
<p style="margin: 0; font-size: 12px; font-weight: 700">times you said no</p>
</div>
<div style="padding: 12px 6px; border-radius: 22px; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 700; color: #1F6B2E">3</p>
<p style="margin: 0; font-size: 12px; font-weight: 700">plans finished</p>
</div>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 26px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.8); border: 1.5px solid #FFFFFF; backdrop-filter: blur(16px); box-shadow: 0 12px 34px rgba(20,60,40,0.2); display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
<a href="Home.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4F6B58; font-family: Fredoka, sans-serif; font-size: 13px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" fill="none" stroke="#4F6B58" stroke-width="2.2" stroke-linejoin="round"></path></svg>home</a>
<a href="Plan.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4F6B58; font-family: Fredoka, sans-serif; font-size: 13px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="#4F6B58" stroke-width="2.2"></rect><path d="M4 10 H20 M9 3 V7 M15 3 V7" stroke="#4F6B58" stroke-width="2.2" stroke-linecap="round"></path></svg>plan</a>
<a href="PickRilo.dc.html" aria-label="Your Rilo" class="tap" style="width: 76px; height: 76px; margin-top: -34px; border-radius: 38px; background: linear-gradient(180deg, #7CC6EE, #CDEBF6); border: 4px solid #FFFFFF; box-shadow: 0 10px 24px rgba(20,60,40,0.22); display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><dc-import name="Buddy" mood="wave" motion="none" size="66" hint-size="66px,61px"></dc-import></a>
<a href="Progress.dc.html" aria-current="page" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1F6B2E; font-family: Fredoka, sans-serif; font-size: 13px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 V13 M12 19 V8 M19 19 V4" stroke="#1F6B2E" stroke-width="2.6" stroke-linecap="round"></path></svg>progress</a>
<a href="PickRilo.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4F6B58; font-family: Fredoka, sans-serif; font-size: 13px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="none" stroke="#4F6B58" stroke-width="2.2"></circle><path d="M4 20 C5 15 19 15 20 20" fill="none" stroke="#4F6B58" stroke-width="2.2" stroke-linecap="round"></path></svg>you</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const data = [['m', 2.8], ['t', 2.4], ['w', 1.9], ['t', 1.7], ['f', 2.2], ['s', 1.5], ['s', 1.8]];
return {
days: data.map(([label, hours], i) => ({
label: label,
barStyle: 'width: 100%; height: ' + Math.round(hours / 3 * 96) + 'px; border-radius: 10px; transform-origin: bottom; animation: grow .7s ' + (0.2 + i * 0.07).toFixed(2) + 's cubic-bezier(.2,.8,.3,1) both; background: ' + (hours <= 2 ? 'linear-gradient(180deg, #4CC160, #2E8B3E)' : 'rgba(18,48,26,0.15)')
}))
};
}
}
</script>
</body>
</html>
