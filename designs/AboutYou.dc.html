<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tell Rilo about you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12301A}a:hover{color:#000000}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tap{transition:transform .15s ease, background .2s ease, color .2s ease}.tap:active{transform:scale(.94)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #12301A">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Sky" hills="low" hint-size="390px,844px"></dc-import></div>

<div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 24px 34px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: center; gap: 8px">
<div style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.8)"></div>
<div style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.8)"></div>
<div style="width: 28px; height: 8px; border-radius: 4px; background: #12301A"></div>
<div style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.8)"></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; animation: rise .5s ease-out both">
<dc-import name="Buddy" mood="curious" size="84" hint-size="84px,78px"></dc-import>
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-size: 30px; font-weight: 700; line-height: 1.05">tell me about you.</h1>
</div>
<div style="padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.55); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 10px; animation: rise .5s .1s ease-out both">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 19px; font-weight: 600">what are you into?</p>
<div style="display: flex; flex-wrap: wrap; gap: 7px">
<sc-for list="{{hobbies}}" as="item" hint-placeholder-count="8">
<button type="button" class="tap" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="{{item.style}}">{{item.label}}</button>
</sc-for>
<button type="button" class="tap" onClick="{{addHobby}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; background: transparent; color: #12301A; border: 2px dashed #12301A">+ add your own</button>
</div>
<sc-if value="{{addingHobby}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; align-items: center">
<label for="newHobby" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New hobby</label>
<input id="newHobby" type="text" placeholder="e.g. skating" value="{{draft}}" onChange="{{onDraft}}" style="flex-grow: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 2px solid #12301A; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; color: #12301A">
<button type="button" class="tap" onClick="{{commit}}" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: #12301A; color: #FFFFFF; font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">add</button>
</div>
</sc-if>
</div>
<div style="padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.55); border: 1.5px solid rgba(255,255,255,0.95); backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 10px; animation: rise .5s .2s ease-out both">
<p style="margin: 0; font-family: Fredoka, sans-serif; font-size: 19px; font-weight: 600">what are you working toward?</p>
<div style="display: flex; flex-wrap: wrap; gap: 7px">
<sc-for list="{{goals}}" as="item" hint-placeholder-count="5">
<button type="button" class="tap" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="{{item.style}}">{{item.label}}</button>
</sc-for>
<button type="button" class="tap" onClick="{{addGoal}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; background: transparent; color: #12301A; border: 2px dashed #12301A">+ add your own</button>
</div>
<sc-if value="{{addingGoal}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; align-items: center">
<label for="newGoal" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New goal</label>
<input id="newGoal" type="text" placeholder="e.g. make varsity" value="{{draft}}" onChange="{{onDraft}}" style="flex-grow: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 2px solid #12301A; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; color: #12301A">
<button type="button" class="tap" onClick="{{commit}}" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: #12301A; color: #FFFFFF; font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">add</button>
</div>
</sc-if>
</div>
<div style="flex-grow: 1"></div>
<a href="PickApps.dc.html" class="tap" style="width: 100%; height: 58px; flex-shrink: 0; border-radius: 999px; background: #FFFFFF; color: #12301A; font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(10,40,20,0.25)">continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { basketball: true, golf: true, 'making videos': true, 'better grades': true, 'grow my content': true }, extra: { hobby: [], goal: [] }, adding: null, draft: '' };
}
chip(label) {
const on = !!this.state.on[label];
const base = 'min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; ';
return {
label: label,
pressed: on ? 'true' : 'false',
style: on ? base + 'background: #12301A; color: #FFFFFF; border: 2px solid #12301A' : base + 'background: rgba(255,255,255,0.85); color: #12301A; border: 2px solid #FFFFFF',
pick: () => this.setState({ on: Object.assign({}, this.state.on, { [label]: !on }) })
};
}
renderVals() {
const hobbies = ['basketball', 'golf', 'gym', 'making videos', 'reading', 'music', 'coding', 'cooking'];
const goals = ['better grades', 'get fit', 'grow my content', 'build something', 'sleep more'];
const add = this.state.adding;
return {
hobbies: hobbies.concat(this.state.extra.hobby).map((h) => this.chip(h)),
goals: goals.concat(this.state.extra.goal).map((g) => this.chip(g)),
addingHobby: add === 'hobby',
addingGoal: add === 'goal',
draft: this.state.draft,
addHobby: () => this.setState({ adding: 'hobby', draft: '' }),
addGoal: () => this.setState({ adding: 'goal', draft: '' }),
onDraft: (e) => this.setState({ draft: e.target.value }),
commit: () => {
const text = this.state.draft.trim().toLowerCase();
if (!text || !add) { this.setState({ adding: null, draft: '' }); return; }
const extra = Object.assign({}, this.state.extra, { [add]: this.state.extra[add].concat([text]) });
this.setState({ extra: extra, on: Object.assign({}, this.state.on, { [text]: true }), adding: null, draft: '' });
}
};
}
}
</script>
</body>
</html>
